<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlainSign Wallet Test Page</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #07111f; color: #eef6ff; display: grid; place-items: center; }
      main { width: min(760px, calc(100% - 40px)); padding: 40px; border: 1px solid #27415f; border-radius: 24px; background: #0c1b2e; box-shadow: 0 24px 80px rgb(0 0 0 / 53%); }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3.5rem); }
      p { color: #aac0d8; font-size: 1.1rem; }
      .buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin: 30px 0; }
      button { min-height: 64px; border: 0; border-radius: 14px; padding: 14px 18px; background: #38d39f; color: #04120d; font: inherit; font-size: 1.08rem; font-weight: 750; cursor: pointer; }
      button:hover { background: #6be5ba; }
      #status { color: #8be8c5; font-weight: 700; }
      #out { min-height: 64px; overflow-wrap: anywhere; white-space: pre-wrap; border-radius: 14px; background: #030a13; padding: 20px; color: #fff; font-size: 1.5rem; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>PlainSign test page</h1>
      <p>Use these buttons to confirm PlainSign appears before your wallet.</p>
      <div id="status">Ready — choose an action below.</div>
      <div class="buttons">
        <button id="connect">Connect</button>
        <button id="send-transaction">Send transaction</button>
        <button id="danger-approval">Dangerous approval</button>
        <button id="sign-typed-data">Sign typed data</button>
        <button id="sign-message">Sign message</button>
        <button id="eth-sign">Raw eth_sign</button>
        <button id="chain-id">Chain id</button>
      </div>
      <pre id="out" aria-live="polite">No request yet.</pre>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
