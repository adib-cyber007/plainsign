name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-dapp/package-lock.json
      - run: npm --prefix demo-dapp ci
      - run: npm --prefix demo-dapp run build
        env:
          VITE_DEMO_CHAIN: "11155111"
          VITE_SEPOLIA_RPC: https://ethereum-sepolia-rpc.publicnode.com
      - name: Publish community denylist
        run: cp docs/denylist.json demo-dapp/dist/denylist.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
